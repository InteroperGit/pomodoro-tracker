name: Deploy to GitHub Pages

on:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.7.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: src/apps/web/pomodoro_client/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: src/apps/web/pomodoro_client
        run: pnpm install --frozen-lockfile

      - name: Build
        working-directory: src/apps/web/pomodoro_client
        run: pnpm build:gh-pages
        env:
          VITE_TASK_TIME_MIN: ${{ vars.VITE_TASK_TIME_MIN || '25' }}
          VITE_SHORT_BREAK_TIME_MIN: ${{ vars.VITE_SHORT_BREAK_TIME_MIN || '5' }}
          VITE_LONG_BREAK_TIME_MIN: ${{ vars.VITE_LONG_BREAK_TIME_MIN || '15' }}
          VITE_LONG_BREAK_AFTER: ${{ vars.VITE_LONG_BREAK_AFTER || '4' }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: src/apps/web/pomodoro_client/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
