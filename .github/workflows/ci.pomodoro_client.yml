name: CI

on:
  push:
    branches: [main]
    paths:
      - 'src/apps/web/pomodoro_client/**'
  pull_request:
    branches: [main]
    paths:
      - 'src/apps/web/pomodoro_client/**'

jobs:
  pomodoro_client:
    name: Pomodoro client
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/apps/web/pomodoro_client

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: src/apps/web/pomodoro_client/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium firefox msedge webkit

      - name: E2E tests
        run: pnpm test:e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: src/apps/web/pomodoro_client/playwright-report/
          retention-days: 14

      - name: Build
        run: pnpm build
